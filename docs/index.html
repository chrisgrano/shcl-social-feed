<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social feed preview</title>
<style>
  body{margin:0;padding:32px 20px;font-family:system-ui,-apple-system,sans-serif;color:#222;background:#fafafa}
  main{max-width:960px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:17px;margin:48px 0 4px}
  p{color:#666;margin:0 0 16px}
  pre{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px;overflow:auto;font-size:13px;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Instagram feed preview</h1>
  <p>Two layouts. Copy the embed code under the one you want.</p>

  <h2>Showcase</h2>
  <p>Styled header, swipeable tall cards with view counts.</p>
  <div style="background:#fff;border-radius:16px;padding:28px 28px 8px;margin-top:12px">
    <div data-social-feed data-layout="showcase"></div>
  </div>
  <pre data-snippet='data-layout="showcase"'></pre>

  <h2>Carousel: one row, swipe or use the arrows</h2>
  <p>Tall 9:16 tiles, like Reels.</p>
  <div data-social-feed data-layout="carousel" data-shape="tall" data-count="15"></div>
  <pre data-snippet='data-layout="carousel" data-shape="tall" data-count="15"'></pre>

  <h2>Carousel with square tiles</h2>
  <div data-social-feed data-layout="carousel" data-count="15"></div>
  <pre data-snippet='data-layout="carousel" data-count="15"'></pre>

  <h2>Grid</h2>
  <div data-social-feed data-count="9" data-columns="3"></div>
  <pre data-snippet='data-count="9" data-columns="3"'></pre>
</main>
<script>
  var url = location.href.replace(/(index\.html)?([?#].*)?$/, "");
  document.querySelectorAll("pre[data-snippet]").forEach(function (pre) {
    pre.textContent =
      "<div data-social-feed " + pre.getAttribute("data-snippet") + "></div>\n" +
      '<script src="' + url + 'widget.js" async><\/script>';
  });
</script>
<script src="widget.js"></script>
</body>
</html>
