name: Update Instagram feed

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch: # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: ["docs/**", "!docs/feed.json", "!docs/media/**"] # redeploy when the widget code changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FEED_LIMIT: 24
        run: node scripts/fetch-instagram.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Update Instagram feed"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
